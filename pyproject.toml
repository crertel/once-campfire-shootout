[project]
name = "campfire-shootout"
version = "0.1.0"
description = "Build and compare the Basecamp Campfire ports on one machine."
requires-python = ">=3.11"

[project.scripts]
campfire-shootout = "shootout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shootout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
